<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>joseppy.ca analytics</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #4a3aa7;
    --series-8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
    max-width: 1080px;
    margin: 0 auto;
  }
  h1 { font-size: 18px; font-weight: 650; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .ranges { display: flex; gap: 4px; }
  .ranges button {
    font: inherit; color: var(--text-secondary); background: none;
    border: 1px solid transparent; border-radius: 8px; padding: 4px 12px; cursor: pointer;
  }
  .ranges button:hover { background: var(--surface-1); }
  .ranges button[aria-pressed="true"] {
    color: var(--text-primary); background: var(--surface-1);
    border-color: var(--border); font-weight: 600;
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .label { color: var(--text-secondary); font-size: 12px; }
  .tile .value { font-size: 26px; font-weight: 650; margin-top: 2px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 12px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart-wrap { overflow-x: auto; position: relative; }
  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-size: 11px; font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 8px; vertical-align: 1px; }
  .sub { color: var(--muted); font-size: 12px; }
  .tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); white-space: nowrap;
  }
  .tooltip .t-day { font-weight: 600; margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  #gate { max-width: 320px; margin: 15vh auto; text-align: center; }
  #gate input {
    font: inherit; width: 100%; margin-top: 12px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1); color: var(--text-primary);
  }
  #gate .err { color: #e34948; font-size: 12px; margin-top: 8px; min-height: 18px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="gate" hidden>
  <h1>Analytics</h1>
  <p class="sub">Enter the dashboard key.</p>
  <input id="key-input" type="password" autocomplete="off" placeholder="Dashboard key">
  <div class="err" id="gate-err"></div>
</div>

<div id="dash" hidden>
  <div class="head">
    <h1>joseppy.ca analytics</h1>
    <div class="ranges" id="ranges" role="group" aria-label="Date range"></div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="card">
    <h2>Plays over time</h2>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap"><div id="chart"></div></div>
  </div>
  <div class="cols">
    <div class="card">
      <h2>By game</h2>
      <div id="apps-table"></div>
    </div>
    <div class="card">
      <h2>By country</h2>
      <div id="countries-table"></div>
    </div>
  </div>
  <div class="card">
    <h2>Recent sessions</h2>
    <div id="recent-table"></div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
(function () {
  "use strict";
  var API = "https://site-analytics.joseppy-workers.workers.dev";
  var KEY_STORAGE = "sa_dash_key";
  var RANGES = [{ d: 7, label: "7d" }, { d: 30, label: "30d" }, { d: 90, label: "90d" }, { d: 365, label: "1y" }, { d: 3650, label: "All" }];
  var APP_LABELS = {
    portfolio: "Portfolio",
    northern_eh: "Northern Eh",
    the_great_puppy_detective: "Puppy Detective",
    spotify_venn: "Spotify Venn",
    q1_wrapped: "Q1 Wrapped"
  };
  // Fixed slot assignment so a game keeps its color regardless of rank or range.
  var APP_SLOTS = { portfolio: 1, northern_eh: 2, the_great_puppy_detective: 3, spotify_venn: 4 };
  var nextSlot = 5;
  var currentDays = 30;

  function slotFor(app) {
    if (!APP_SLOTS[app]) { APP_SLOTS[app] = nextSlot < 9 ? nextSlot++ : 8; }
    return APP_SLOTS[app];
  }
  function colorFor(app) { return "var(--series-" + slotFor(app) + ")"; }
  function labelFor(app) { return APP_LABELS[app] || app; }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }
  function svgEl(tag, attrs) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs || {}) node.setAttribute(k, attrs[k]);
    return node;
  }
  function fmtDuration(s) {
    s = Math.round(s || 0);
    if (s < 60) return s + "s";
    if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
    return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
  }
  var regionNames;
  try { regionNames = new Intl.DisplayNames(["en"], { type: "region" }); } catch (e) {}
  function countryName(code) {
    if (!code || code === "??") return "Unknown";
    try { return regionNames ? regionNames.of(code) : code; } catch (e) { return code; }
  }
  function flag(code) {
    if (!code || !/^[A-Z]{2}$/.test(code)) return "";
    return String.fromCodePoint(0x1f1e6 + code.charCodeAt(0) - 65, 0x1f1e6 + code.charCodeAt(1) - 65) + " ";
  }

  function getKey() { try { return localStorage.getItem(KEY_STORAGE) || ""; } catch (e) { return ""; } }
  function setKey(v) { try { localStorage.setItem(KEY_STORAGE, v); } catch (e) {} }

  function showGate(message) {
    document.getElementById("dash").hidden = true;
    var gate = document.getElementById("gate");
    gate.hidden = false;
    document.getElementById("gate-err").textContent = message || "";
    document.getElementById("key-input").focus();
  }

  function load(days) {
    currentDays = days;
    fetch(API + "/api/stats?days=" + days, { headers: { "x-dash-key": getKey() } })
      .then(function (res) {
        if (res.status === 401) { showGate(getKey() ? "Wrong key." : ""); throw new Error("unauthorized");
        }
        if (!res.ok) throw new Error("request failed: " + res.status);
        return res.json();
      })
      .then(render)
      .catch(function (err) { if (err.message !== "unauthorized") console.error(err); });
  }

  function render(data) {
    document.getElementById("gate").hidden = true;
    document.getElementById("dash").hidden = false;
    renderRanges();
    renderTiles(data);
    renderChart(data);
    renderApps(data.apps);
    renderCountries(data.countries);
    renderRecent(data.recent);
  }

  function renderRanges() {
    var wrap = document.getElementById("ranges");
    wrap.textContent = "";
    RANGES.forEach(function (r) {
      var b = el("button", { text: r.label, "aria-pressed": String(r.d === currentDays) });
      b.addEventListener("click", function () { load(r.d); });
      wrap.appendChild(b);
    });
  }

  function renderTiles(data) {
    var t = data.totals || {};
    var avg = t.plays ? (t.total_s || 0) / t.plays : 0;
    var tiles = [
      { label: "Plays", value: String(t.plays || 0) },
      { label: "Time played", value: fmtDuration(t.total_s) },
      { label: "Avg session", value: fmtDuration(avg) },
      { label: "Countries", value: String(t.countries || 0) }
    ];
    var wrap = document.getElementById("tiles");
    wrap.textContent = "";
    tiles.forEach(function (tile) {
      wrap.appendChild(el("div", { class: "tile" }, [
        el("div", { class: "label", text: tile.label }),
        el("div", { class: "value", text: tile.value })
      ]));
    });
  }

  function dayList(days) {
    var out = [];
    var d = new Date();
    d.setUTCHours(0, 0, 0, 0);
    for (var i = days - 1; i >= 0; i--) {
      var dt = new Date(d.getTime() - i * 86400000);
      out.push(dt.toISOString().slice(0, 10));
    }
    return out;
  }

  function renderChart(data) {
    var wrap = document.getElementById("chart");
    var legend = document.getElementById("legend");
    wrap.textContent = "";
    legend.textContent = "";

    var apps = (data.apps || []).map(function (a) { return a.app; });
    apps.sort(function (a, b) { return slotFor(a) - slotFor(b); });
    var byDay = {};
    (data.daily || []).forEach(function (row) {
      byDay[row.day] = byDay[row.day] || {};
      byDay[row.day][row.app] = row.plays;
    });
    var days = dayList(data.days);
    var firstData = null;
    (data.daily || []).forEach(function (row) {
      if (!firstData || row.day < firstData) firstData = row.day;
    });
    if (firstData) {
      var firstIdx = days.indexOf(firstData);
      if (firstIdx > 0) days = days.slice(Math.min(firstIdx, days.length - 7));
    }
    var bucketSize = days.length > 400 ? 30 : days.length > 120 ? 7 : 1;
    var buckets = [];
    for (var bi = 0; bi < days.length; bi += bucketSize) {
      buckets.push(days.slice(bi, bi + bucketSize));
    }
    function bucketCount(bucket, app) {
      var total = 0;
      bucket.forEach(function (day) { total += (byDay[day] || {})[app] || 0; });
      return total;
    }
    function bucketLabel(bucket) {
      if (bucket.length === 1) return bucket[0];
      return bucket[0] + " to " + bucket[bucket.length - 1];
    }
    var maxTotal = 0;
    buckets.forEach(function (bucket) {
      var total = 0;
      apps.forEach(function (app) { total += bucketCount(bucket, app); });
      if (total > maxTotal) maxTotal = total;
    });

    if (!maxTotal) {
      wrap.appendChild(el("div", { class: "empty", text: "No plays in this range yet." }));
      return;
    }

    apps.forEach(function (app) {
      var chip = el("span", {}, [el("i", {})]);
      chip.firstChild.style.background = colorFor(app);
      chip.appendChild(document.createTextNode(labelFor(app)));
      legend.appendChild(chip);
    });

    var W = Math.max(640, wrap.clientWidth || 640);
    var H = 220, padL = 30, padB = 20, padT = 8;
    var plotW = W - padL - 8, plotH = H - padT - padB;
    var step = plotW / buckets.length;
    var barW = Math.max(2, Math.min(28, step - 2));
    var yMax = Math.max(4, Math.ceil(maxTotal * 1.1));
    var svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Stacked bar chart of plays over time" });

    [0, 0.5, 1].forEach(function (f) {
      var y = padT + plotH - plotH * f;
      svg.appendChild(svgEl("line", { x1: padL, x2: W - 8, y1: y, y2: y, stroke: f === 0 ? "var(--baseline)" : "var(--grid)", "stroke-width": 1 }));
      var label = svgEl("text", { x: padL - 6, y: y + 4, "text-anchor": "end" });
      label.textContent = String(Math.round(yMax * f));
      svg.appendChild(label);
    });

    var tooltip = document.getElementById("tooltip");
    buckets.forEach(function (bucket, i) {
      var x = padL + i * step + (step - barW) / 2;
      var yCursor = padT + plotH;
      var stack = [];
      apps.forEach(function (app) {
        var v = bucketCount(bucket, app);
        if (!v) return;
        stack.push({ app: app, v: v });
        var h = (v / yMax) * plotH;
        yCursor -= h;
        var rect = svgEl("rect", {
          x: x, y: yCursor, width: barW, height: Math.max(h - 1, 1),
          fill: colorFor(app), stroke: "var(--surface-1)", "stroke-width": 1
        });
        svg.appendChild(rect);
      });
      if (stack.length) {
        var topY = yCursor;
        var cap = svgEl("rect", { x: x, y: topY, width: barW, height: 3, rx: 1.5, fill: colorFor(stack[stack.length - 1].app) });
        svg.appendChild(cap);
      }
      var hit = svgEl("rect", { x: padL + i * step, y: padT, width: step, height: plotH, fill: "transparent" });
      hit.addEventListener("mousemove", function (ev) {
        tooltip.style.display = "block";
        tooltip.textContent = "";
        tooltip.appendChild(el("div", { class: "t-day", text: bucketLabel(bucket) }));
        if (!stack.length) tooltip.appendChild(el("div", { class: "t-row", text: "No plays" }));
        stack.slice().reverse().forEach(function (s) {
          var row = el("div", { class: "t-row" }, [el("i", { class: "dot" })]);
          row.firstChild.style.background = colorFor(s.app);
          row.appendChild(document.createTextNode(labelFor(s.app) + ": " + s.v));
          tooltip.appendChild(row);
        });
        tooltip.style.left = Math.min(ev.clientX + 12, window.innerWidth - tooltip.offsetWidth - 8) + "px";
        tooltip.style.top = (ev.clientY + 12) + "px";
      });
      hit.addEventListener("mouseleave", function () { tooltip.style.display = "none"; });
      svg.appendChild(hit);

      var every = Math.ceil(buckets.length / 10);
      if (i % every === 0) {
        var t = svgEl("text", { x: padL + i * step + step / 2, y: H - 4, "text-anchor": "middle" });
        t.textContent = bucketSize >= 30 ? bucket[0].slice(0, 7) : bucket[0].slice(5);
        svg.appendChild(t);
      }
    });

    wrap.appendChild(svg);
  }

  function table(headers, rows) {
    var thead = el("thead", {}, [el("tr", {}, headers.map(function (h) {
      return el("th", { text: h.label, class: h.num ? "num" : "" });
    }))]);
    var tbody = el("tbody", {}, rows);
    return el("table", {}, [thead, tbody]);
  }

  function renderApps(apps) {
    var wrap = document.getElementById("apps-table");
    wrap.textContent = "";
    if (!apps.length) { wrap.appendChild(el("div", { class: "empty", text: "Nothing yet." })); return; }
    var rows = apps.map(function (a) {
      var nameCell = el("td", {}, [el("i", { class: "dot" })]);
      nameCell.firstChild.style.background = colorFor(a.app);
      nameCell.appendChild(document.createTextNode(labelFor(a.app)));
      return el("tr", {}, [
        nameCell,
        el("td", { class: "num", text: String(a.plays) }),
        el("td", { class: "num", text: fmtDuration(a.total_s) }),
        el("td", { class: "num", text: fmtDuration(a.avg_s) })
      ]);
    });
    wrap.appendChild(table([{ label: "Game" }, { label: "Plays", num: 1 }, { label: "Time", num: 1 }, { label: "Avg", num: 1 }], rows));
  }

  function renderCountries(countries) {
    var wrap = document.getElementById("countries-table");
    wrap.textContent = "";
    if (!countries.length) { wrap.appendChild(el("div", { class: "empty", text: "Nothing yet." })); return; }
    var rows = countries.map(function (c) {
      return el("tr", {}, [
        el("td", { text: flag(c.country) + countryName(c.country) }),
        el("td", { class: "num", text: String(c.plays) }),
        el("td", { class: "num", text: fmtDuration(c.total_s) })
      ]);
    });
    wrap.appendChild(table([{ label: "Country" }, { label: "Plays", num: 1 }, { label: "Time", num: 1 }], rows));
  }

  function renderRecent(recent) {
    var wrap = document.getElementById("recent-table");
    wrap.textContent = "";
    if (!recent.length) { wrap.appendChild(el("div", { class: "empty", text: "Nothing yet." })); return; }
    var rows = recent.map(function (r) {
      var when = new Date(r.started_at);
      var place = [r.city, r.region].filter(Boolean).join(", ");
      var nameCell = el("td", {}, [el("i", { class: "dot" })]);
      nameCell.firstChild.style.background = colorFor(r.app);
      nameCell.appendChild(document.createTextNode(labelFor(r.app)));
      return el("tr", {}, [
        nameCell,
        el("td", { text: flag(r.country) + (place || countryName(r.country)) }),
        el("td", { text: r.device || "" }),
        el("td", { text: r.referrer || "direct" }),
        el("td", { class: "num", text: fmtDuration(r.duration_s) }),
        el("td", { class: "num sub", text: when.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) })
      ]);
    });
    wrap.appendChild(table(
      [{ label: "Game" }, { label: "Where" }, { label: "Device" }, { label: "Referrer" }, { label: "Duration", num: 1 }, { label: "When", num: 1 }],
      rows
    ));
  }

  document.getElementById("key-input").addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter") return;
    setKey(ev.target.value.trim());
    ev.target.value = "";
    load(currentDays);
  });

  if (getKey()) load(currentDays);
  else showGate("");
})();
</script>
</body>
</html>
