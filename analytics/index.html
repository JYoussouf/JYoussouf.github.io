<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pulse · joseppy.ca</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128200;</text></svg>">
<style>
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --surface-2: #222221;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.14);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --surface-2: #f2f1ee;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
    --accent-soft: rgba(42, 120, 214, 0.10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #4a3aa7;
    --series-8: #e34948;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 0 24px 48px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .head {
    position: sticky; top: 0; z-index: 5;
    background: var(--page);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 18px 0 14px;
    border-bottom: 1px solid var(--grid);
    margin-bottom: 20px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .brand .sub { color: var(--muted); font-size: 13px; }
  .controls { display: flex; align-items: center; gap: 8px; }
  .ranges { display: flex; gap: 2px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 2px; }
  .ranges button {
    font: inherit; font-size: 13px; color: var(--text-secondary); background: none;
    border: none; border-radius: 8px; padding: 4px 11px; cursor: pointer;
  }
  .ranges button:hover { color: var(--text-primary); }
  .ranges button[aria-pressed="true"] { color: var(--text-primary); background: var(--surface-2); font-weight: 600; }
  .icon-btn {
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer;
    background: var(--surface-1); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px;
  }
  .icon-btn:hover { color: var(--text-primary); }

  .highlights { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 13px; font-size: 13px; color: var(--text-secondary);
  }
  .chip strong { color: var(--text-primary); font-weight: 600; }
  .chip.hot { background: var(--accent-soft); border-color: var(--accent); color: var(--text-primary); }
  .chip.hot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .chip .up { color: #0ca30c; }
  .chip .down { color: #e34948; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .tile .label { color: var(--muted); font-size: 12px; }
  .tile .value { font-size: 27px; font-weight: 650; margin-top: 2px; letter-spacing: -0.01em; }
  .tile .delta { font-size: 12px; margin-top: 2px; color: var(--muted); }
  .tile .delta .up { color: #0ca30c; }
  .tile .delta .down { color: #e34948; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
  .card__head {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    font: inherit; background: none; border: none; color: inherit; cursor: pointer;
    padding: 13px 16px; text-align: left;
  }
  .card__head h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.01em; }
  .card__head .chev { color: var(--muted); font-size: 11px; transition: transform 0.15s; }
  .card.collapsed .card__head .chev { transform: rotate(-90deg); }
  .card__body { padding: 0 16px 16px; }
  .card.collapsed .card__body { display: none; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 12px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart-wrap { overflow-x: auto; }
  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cols .card { margin-bottom: 16px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } body { padding: 0 14px 40px; } }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-size: 11px; font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 8px; vertical-align: 1px; }
  .sub { color: var(--muted); font-size: 12px; }
  .show-more {
    display: block; width: 100%; margin-top: 8px; padding: 6px;
    font: inherit; font-size: 12px; color: var(--muted); background: none;
    border: none; border-top: 1px dashed var(--grid); cursor: pointer;
  }
  .show-more:hover { color: var(--text-primary); }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.28); white-space: nowrap;
  }
  .tooltip .t-day { font-weight: 600; margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }

  #gate { max-width: 320px; margin: 18vh auto 0; text-align: center; }
  #gate h1 { font-size: 22px; margin-bottom: 4px; }
  #gate input {
    font: inherit; width: 100%; margin-top: 14px; padding: 9px 11px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); color: var(--text-primary);
  }
  #gate .err { color: #e34948; font-size: 12px; margin-top: 8px; min-height: 18px; }
  .empty { color: var(--muted); text-align: center; padding: 22px 0; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="gate" hidden>
  <h1>Pulse</h1>
  <p class="sub">joseppy.ca analytics · enter the key</p>
  <input id="key-input" type="password" autocomplete="off" placeholder="Dashboard key">
  <div class="err" id="gate-err"></div>
</div>

<div id="dash" hidden>
  <div class="head">
    <div class="brand"><h1>Pulse</h1><span class="sub">joseppy.ca</span></div>
    <div class="controls">
      <div class="ranges" id="ranges" role="group" aria-label="Date range"></div>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">&#9788;</button>
    </div>
  </div>

  <div class="highlights" id="highlights"></div>
  <div class="tiles" id="tiles"></div>

  <div class="card" data-card="chart">
    <button class="card__head"><h2>Plays over time</h2><span class="chev">&#9660;</span></button>
    <div class="card__body">
      <div class="legend" id="legend"></div>
      <div class="chart-wrap"><div id="chart"></div></div>
    </div>
  </div>

  <div class="cols">
    <div class="card" data-card="apps">
      <button class="card__head"><h2>By game</h2><span class="chev">&#9660;</span></button>
      <div class="card__body"><div id="apps-table"></div></div>
    </div>
    <div class="card" data-card="countries">
      <button class="card__head"><h2>By country</h2><span class="chev">&#9660;</span></button>
      <div class="card__body"><div id="countries-table"></div></div>
    </div>
    <div class="card" data-card="events">
      <button class="card__head"><h2>Clicks</h2><span class="chev">&#9660;</span></button>
      <div class="card__body"><div id="events-table"></div></div>
    </div>
    <div class="card" data-card="recent-events">
      <button class="card__head"><h2>Recent clicks</h2><span class="chev">&#9660;</span></button>
      <div class="card__body"><div id="recent-events-table"></div></div>
    </div>
    <div class="card" data-card="leaderboard">
      <button class="card__head"><h2>Puppy Detective leaderboard</h2><span class="chev">&#9660;</span></button>
      <div class="card__body"><div id="leaderboard-table"></div></div>
    </div>
  </div>

  <div class="card" data-card="recent">
    <button class="card__head"><h2>Recent sessions</h2><span class="chev">&#9660;</span></button>
    <div class="card__body"><div id="recent-table"></div></div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
(function () {
  "use strict";
  var API = "https://site-analytics.joseppy-workers.workers.dev";
  var KEY_STORAGE = "sa_dash_key";
  var THEME_STORAGE = "sa_theme";
  var COLLAPSE_STORAGE = "sa_collapsed";
  var TABLE_LIMIT = 8;
  var RANGES = [{ d: 7, label: "7d" }, { d: 30, label: "30d" }, { d: 90, label: "90d" }, { d: 365, label: "1y" }, { d: 3650, label: "All" }];
  var APP_LABELS = {
    portfolio: "Portfolio",
    northern_eh: "Northern Eh",
    the_great_puppy_detective: "Puppy Detective",
    spotify_venn: "Spotify Venn",
    q1_wrapped: "Q1 Wrapped"
  };
  var APP_SLOTS = { portfolio: 1, northern_eh: 2, the_great_puppy_detective: 3, spotify_venn: 4 };
  var EVENT_LABELS = {
    cv_open: "CV opened",
    github_click: "GitHub visit",
    tierlistbot_click: "TierListBot visit",
    score_submit: "Score submitted",
    session_high_score: "Session high score",
    outbound_click: "Outbound click",
    form_start: "Form started",
    file_download: "File download"
  };
  var nextSlot = 5;
  var currentDays = 30;
  var leaderboardLoaded = false;

  function slotFor(app) {
    if (!APP_SLOTS[app]) { APP_SLOTS[app] = nextSlot < 9 ? nextSlot++ : 8; }
    return APP_SLOTS[app];
  }
  function colorFor(app) { return "var(--series-" + slotFor(app) + ")"; }
  function labelFor(app) { return APP_LABELS[app] || app; }
  function eventLabel(name) { return EVENT_LABELS[name] || name; }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }
  function svgEl(tag, attrs) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs || {}) node.setAttribute(k, attrs[k]);
    return node;
  }
  function fmtDuration(s) {
    s = Math.round(s || 0);
    if (s < 60) return s + "s";
    if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
    return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
  }
  var regionNames;
  try { regionNames = new Intl.DisplayNames(["en"], { type: "region" }); } catch (e) {}
  function countryName(code) {
    if (!code || code === "??") return "Unknown";
    try { return regionNames ? regionNames.of(code) : code; } catch (e) { return code; }
  }
  function flag(code) {
    if (!code || !/^[A-Z]{2}$/.test(code)) return "";
    return String.fromCodePoint(0x1f1e6 + code.charCodeAt(0) - 65, 0x1f1e6 + code.charCodeAt(1) - 65) + " ";
  }

  /* ---------- theme ---------- */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("theme-toggle").innerHTML = theme === "dark" ? "&#9788;" : "&#9789;";
  }
  try { applyTheme(localStorage.getItem(THEME_STORAGE) || "dark"); } catch (e) { applyTheme("dark"); }
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_STORAGE, next); } catch (e) {}
    applyTheme(next);
  });

  /* ---------- collapsible cards ---------- */
  function collapsedSet() {
    try { return new Set(JSON.parse(localStorage.getItem(COLLAPSE_STORAGE) || "[]")); } catch (e) { return new Set(); }
  }
  function saveCollapsed(set) {
    try { localStorage.setItem(COLLAPSE_STORAGE, JSON.stringify(Array.from(set))); } catch (e) {}
  }
  (function initCollapse() {
    var collapsed = collapsedSet();
    document.querySelectorAll(".card[data-card]").forEach(function (card) {
      var id = card.getAttribute("data-card");
      if (collapsed.has(id)) card.classList.add("collapsed");
      card.querySelector(".card__head").addEventListener("click", function () {
        card.classList.toggle("collapsed");
        var set = collapsedSet();
        if (card.classList.contains("collapsed")) set.add(id); else set.delete(id);
        saveCollapsed(set);
      });
    });
  })();

  /* ---------- auth + fetch ---------- */
  function getKey() { try { return localStorage.getItem(KEY_STORAGE) || ""; } catch (e) { return ""; } }
  function setKey(v) { try { localStorage.setItem(KEY_STORAGE, v); } catch (e) {} }

  function showGate(message) {
    document.getElementById("dash").hidden = true;
    var gate = document.getElementById("gate");
    gate.hidden = false;
    document.getElementById("gate-err").textContent = message || "";
    document.getElementById("key-input").focus();
  }

  function load(days) {
    currentDays = days;
    fetch(API + "/api/stats?days=" + days, { headers: { "x-dash-key": getKey() } })
      .then(function (res) {
        if (res.status === 401) { showGate(getKey() ? "Wrong key." : ""); throw new Error("unauthorized"); }
        if (!res.ok) throw new Error("request failed: " + res.status);
        return res.json();
      })
      .then(render)
      .catch(function (err) { if (err.message !== "unauthorized") console.error(err); });
  }

  function render(data) {
    document.getElementById("gate").hidden = true;
    document.getElementById("dash").hidden = false;
    renderRanges();
    renderHighlights(data);
    renderTiles(data);
    renderChart(data);
    renderApps(data.apps);
    renderCountries(data.countries);
    renderEvents(data.events || []);
    renderRecentEvents(data.recentEvents || []);
    renderRecent(data.recent);
    if (!leaderboardLoaded) { leaderboardLoaded = true; loadLeaderboard(); }
  }

  function renderRanges() {
    var wrap = document.getElementById("ranges");
    wrap.textContent = "";
    RANGES.forEach(function (r) {
      var b = el("button", { text: r.label, "aria-pressed": String(r.d === currentDays) });
      b.addEventListener("click", function () { load(r.d); });
      wrap.appendChild(b);
    });
  }

  /* ---------- highlights ---------- */
  function chip(hot, parts) {
    var c = el("span", { class: "chip" + (hot ? " hot" : "") });
    parts.forEach(function (p) {
      if (typeof p === "string") c.appendChild(document.createTextNode(p));
      else c.appendChild(p);
    });
    return c;
  }
  function deltaNode(current, previous) {
    if (!previous) return el("strong", { text: "new" });
    var pct = Math.round(((current - previous) / previous) * 100);
    if (pct === 0) return el("span", { class: "sub", text: "flat" });
    var node = el("span", { class: pct > 0 ? "up" : "down" });
    node.textContent = (pct > 0 ? "↑ " : "↓ ") + Math.abs(pct) + "%";
    return node;
  }

  function renderHighlights(data) {
    var wrap = document.getElementById("highlights");
    wrap.textContent = "";
    var ins = data.insights || {};
    var week = ins.week || { plays: 0, total_s: 0 };
    var prev = ins.prevWeek || { plays: 0, total_s: 0 };
    var weekEvents = {};
    (ins.weekEvents || []).forEach(function (e) { weekEvents[e.name] = e.count; });

    if (week.plays > 0) {
      var pct = prev.plays ? Math.abs(Math.round(((week.plays - prev.plays) / prev.plays) * 100)) : null;
      var hot = !prev.plays || pct >= 25;
      wrap.appendChild(chip(hot, [el("strong", { text: week.plays + (week.plays === 1 ? " play" : " plays") }), " this week ", deltaNode(week.plays, prev.plays)]));
    } else if (prev.plays > 0) {
      wrap.appendChild(chip(false, ["Quiet week: ", el("strong", { text: "0 plays" }), " (was " + prev.plays + ")"]));
    }

    (ins.newCountries || []).slice(0, 5).forEach(function (c) {
      wrap.appendChild(chip(true, ["New country: ", el("strong", { text: flag(c.country) + countryName(c.country) })]));
    });

    if (weekEvents.cv_open) {
      wrap.appendChild(chip(true, ["CV opened ", el("strong", { text: weekEvents.cv_open + "×" }), " this week"]));
    }
    if (weekEvents.score_submit) {
      wrap.appendChild(chip(true, [el("strong", { text: weekEvents.score_submit + (weekEvents.score_submit === 1 ? " score" : " scores") }), " submitted this week"]));
    }

    if (ins.longest && ins.longest.duration_s >= 60) {
      var where = ins.longest.city ? " from " + ins.longest.city : "";
      wrap.appendChild(chip(false, ["Longest session: ", el("strong", { text: fmtDuration(ins.longest.duration_s) }), " on " + labelFor(ins.longest.app) + where]));
    }
    if (ins.busiest && ins.busiest.plays > 1) {
      wrap.appendChild(chip(false, ["Busiest day: ", el("strong", { text: ins.busiest.day }), " (" + ins.busiest.plays + " plays)"]));
    }
    if (!wrap.childNodes.length) {
      wrap.appendChild(chip(false, ["All quiet. Share a game link and watch this light up."]));
    }
  }

  /* ---------- tiles ---------- */
  function renderTiles(data) {
    var t = data.totals || {};
    var ins = data.insights || {};
    var avg = t.plays ? (t.total_s || 0) / t.plays : 0;
    var wrap = document.getElementById("tiles");
    wrap.textContent = "";
    var tiles = [
      { label: "Plays", value: String(t.plays || 0) },
      { label: "Time played", value: fmtDuration(t.total_s) },
      { label: "Avg session", value: fmtDuration(avg) },
      { label: "Countries", value: String(t.countries || 0) }
    ];
    tiles.forEach(function (tile, i) {
      var node = el("div", { class: "tile" }, [
        el("div", { class: "label", text: tile.label }),
        el("div", { class: "value", text: tile.value })
      ]);
      if (i === 0 && ins.week) {
        var delta = el("div", { class: "delta" }, [deltaNode(ins.week.plays || 0, (ins.prevWeek || {}).plays || 0)]);
        delta.appendChild(document.createTextNode(" vs last week"));
        node.appendChild(delta);
      }
      wrap.appendChild(node);
    });
  }

  /* ---------- chart ---------- */
  function dayList(days) {
    var out = [];
    var d = new Date();
    d.setUTCHours(0, 0, 0, 0);
    for (var i = days - 1; i >= 0; i--) {
      var dt = new Date(d.getTime() - i * 86400000);
      out.push(dt.toISOString().slice(0, 10));
    }
    return out;
  }

  function renderChart(data) {
    var wrap = document.getElementById("chart");
    var legend = document.getElementById("legend");
    wrap.textContent = "";
    legend.textContent = "";

    var apps = (data.apps || []).map(function (a) { return a.app; });
    apps.sort(function (a, b) { return slotFor(a) - slotFor(b); });
    var byDay = {};
    (data.daily || []).forEach(function (row) {
      byDay[row.day] = byDay[row.day] || {};
      byDay[row.day][row.app] = row.plays;
    });
    var days = dayList(data.days);
    var firstData = null;
    (data.daily || []).forEach(function (row) {
      if (!firstData || row.day < firstData) firstData = row.day;
    });
    if (firstData) {
      var firstIdx = days.indexOf(firstData);
      if (firstIdx > 0) days = days.slice(Math.min(firstIdx, days.length - 7));
    }
    var bucketSize = days.length > 400 ? 30 : days.length > 120 ? 7 : 1;
    var buckets = [];
    for (var bi = 0; bi < days.length; bi += bucketSize) {
      buckets.push(days.slice(bi, bi + bucketSize));
    }
    function bucketCount(bucket, app) {
      var total = 0;
      bucket.forEach(function (day) { total += (byDay[day] || {})[app] || 0; });
      return total;
    }
    function bucketLabel(bucket) {
      if (bucket.length === 1) return bucket[0];
      return bucket[0] + " to " + bucket[bucket.length - 1];
    }
    var maxTotal = 0;
    buckets.forEach(function (bucket) {
      var total = 0;
      apps.forEach(function (app) { total += bucketCount(bucket, app); });
      if (total > maxTotal) maxTotal = total;
    });

    if (!maxTotal) {
      wrap.appendChild(el("div", { class: "empty", text: "No plays in this range yet." }));
      return;
    }

    apps.forEach(function (app) {
      var chipEl = el("span", {}, [el("i", {})]);
      chipEl.firstChild.style.background = colorFor(app);
      chipEl.appendChild(document.createTextNode(labelFor(app)));
      legend.appendChild(chipEl);
    });

    var W = Math.max(640, wrap.clientWidth || 640);
    var H = 220, padL = 30, padB = 20, padT = 8;
    var plotW = W - padL - 8, plotH = H - padT - padB;
    var step = plotW / buckets.length;
    var barW = Math.max(2, Math.min(28, step - 2));
    var yMax = Math.max(4, Math.ceil(maxTotal * 1.1));
    var svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Stacked bar chart of plays over time" });

    [0, 0.5, 1].forEach(function (f) {
      var y = padT + plotH - plotH * f;
      svg.appendChild(svgEl("line", { x1: padL, x2: W - 8, y1: y, y2: y, stroke: f === 0 ? "var(--baseline)" : "var(--grid)", "stroke-width": 1 }));
      var label = svgEl("text", { x: padL - 6, y: y + 4, "text-anchor": "end" });
      label.textContent = String(Math.round(yMax * f));
      svg.appendChild(label);
    });

    var tooltip = document.getElementById("tooltip");
    buckets.forEach(function (bucket, i) {
      var x = padL + i * step + (step - barW) / 2;
      var yCursor = padT + plotH;
      var stack = [];
      apps.forEach(function (app) {
        var v = bucketCount(bucket, app);
        if (!v) return;
        stack.push({ app: app, v: v });
        var h = (v / yMax) * plotH;
        yCursor -= h;
        var rect = svgEl("rect", {
          x: x, y: yCursor, width: barW, height: Math.max(h - 1, 1),
          fill: colorFor(app), stroke: "var(--surface-1)", "stroke-width": 1
        });
        svg.appendChild(rect);
      });
      if (stack.length) {
        var cap = svgEl("rect", { x: x, y: yCursor, width: barW, height: 3, rx: 1.5, fill: colorFor(stack[stack.length - 1].app) });
        svg.appendChild(cap);
      }
      var hit = svgEl("rect", { x: padL + i * step, y: padT, width: step, height: plotH, fill: "transparent" });
      hit.addEventListener("mousemove", function (ev) {
        tooltip.style.display = "block";
        tooltip.textContent = "";
        tooltip.appendChild(el("div", { class: "t-day", text: bucketLabel(bucket) }));
        if (!stack.length) tooltip.appendChild(el("div", { class: "t-row", text: "No plays" }));
        stack.slice().reverse().forEach(function (s) {
          var row = el("div", { class: "t-row" }, [el("i", { class: "dot" })]);
          row.firstChild.style.background = colorFor(s.app);
          row.appendChild(document.createTextNode(labelFor(s.app) + ": " + s.v));
          tooltip.appendChild(row);
        });
        tooltip.style.left = Math.min(ev.clientX + 12, window.innerWidth - tooltip.offsetWidth - 8) + "px";
        tooltip.style.top = (ev.clientY + 12) + "px";
      });
      hit.addEventListener("mouseleave", function () { tooltip.style.display = "none"; });
      svg.appendChild(hit);

      var every = Math.ceil(buckets.length / 10);
      if (i % every === 0) {
        var t = svgEl("text", { x: padL + i * step + step / 2, y: H - 4, "text-anchor": "middle" });
        t.textContent = bucketSize >= 30 ? bucket[0].slice(0, 7) : bucket[0].slice(5);
        svg.appendChild(t);
      }
    });

    wrap.appendChild(svg);
  }

  /* ---------- tables ---------- */
  function table(headers, rows) {
    var thead = el("thead", {}, [el("tr", {}, headers.map(function (h) {
      return el("th", { text: h.label, class: h.num ? "num" : "" });
    }))]);
    var tbody = el("tbody", {}, rows);
    return el("table", {}, [thead, tbody]);
  }

  function limitedTable(wrap, headers, rows) {
    wrap.textContent = "";
    if (!rows.length) { wrap.appendChild(el("div", { class: "empty", text: "Nothing yet." })); return; }
    function draw(showAll) {
      wrap.textContent = "";
      wrap.appendChild(table(headers, showAll ? rows : rows.slice(0, TABLE_LIMIT)));
      if (rows.length > TABLE_LIMIT) {
        var btn = el("button", { class: "show-more", text: showAll ? "Show less" : "Show all " + rows.length });
        btn.addEventListener("click", function () { draw(!showAll); });
        wrap.appendChild(btn);
      }
    }
    draw(false);
  }

  function appCell(app) {
    var cell = el("td", {}, [el("i", { class: "dot" })]);
    cell.firstChild.style.background = colorFor(app);
    cell.appendChild(document.createTextNode(labelFor(app)));
    return cell;
  }

  function renderApps(apps) {
    limitedTable(
      document.getElementById("apps-table"),
      [{ label: "Game" }, { label: "Plays", num: 1 }, { label: "Time", num: 1 }, { label: "Avg", num: 1 }],
      (apps || []).map(function (a) {
        return el("tr", {}, [
          appCell(a.app),
          el("td", { class: "num", text: String(a.plays) }),
          el("td", { class: "num", text: fmtDuration(a.total_s) }),
          el("td", { class: "num", text: fmtDuration(a.avg_s) })
        ]);
      })
    );
  }

  function renderCountries(countries) {
    limitedTable(
      document.getElementById("countries-table"),
      [{ label: "Country" }, { label: "Plays", num: 1 }, { label: "Time", num: 1 }],
      (countries || []).map(function (c) {
        return el("tr", {}, [
          el("td", { text: flag(c.country) + countryName(c.country) }),
          el("td", { class: "num", text: String(c.plays) }),
          el("td", { class: "num", text: fmtDuration(c.total_s) })
        ]);
      })
    );
  }

  function renderEvents(events) {
    limitedTable(
      document.getElementById("events-table"),
      [{ label: "Event" }, { label: "Count", num: 1 }],
      events.map(function (e) {
        return el("tr", {}, [
          el("td", { text: eventLabel(e.name) }),
          el("td", { class: "num", text: String(e.count) })
        ]);
      })
    );
  }

  function renderRecentEvents(recentEvents) {
    limitedTable(
      document.getElementById("recent-events-table"),
      [{ label: "Event" }, { label: "Where" }, { label: "When", num: 1 }],
      recentEvents.map(function (e) {
        var when = new Date(e.created_at);
        var place = [e.city, e.region].filter(Boolean).join(", ") || countryName(e.country);
        return el("tr", {}, [
          el("td", { text: eventLabel(e.name) + (e.meta ? " (" + e.meta + ")" : "") }),
          el("td", { text: flag(e.country) + place }),
          el("td", { class: "num sub", text: when.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) })
        ]);
      })
    );
  }

  function loadLeaderboard() {
    var wrap = document.getElementById("leaderboard-table");
    fetch("https://gpd-leaderboard.joseppy-workers.workers.dev/api/leaderboard?limit=10")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var entries = data.entries || [];
        wrap.textContent = "";
        if (!entries.length) { wrap.appendChild(el("div", { class: "empty", text: "No scores yet." })); return; }
        var rows = entries.map(function (entry, i) {
          return el("tr", {}, [
            el("td", { class: "num sub", text: String(i + 1) }),
            el("td", { text: entry[0] }),
            el("td", { class: "num", text: String(entry[1]) })
          ]);
        });
        wrap.appendChild(table([{ label: "#", num: 1 }, { label: "Player" }, { label: "Score", num: 1 }], rows));
      })
      .catch(function () {
        wrap.textContent = "";
        wrap.appendChild(el("div", { class: "empty", text: "Leaderboard unavailable." }));
      });
  }

  function renderRecent(recent) {
    limitedTable(
      document.getElementById("recent-table"),
      [{ label: "Game" }, { label: "Where" }, { label: "Device" }, { label: "Referrer" }, { label: "Duration", num: 1 }, { label: "When", num: 1 }],
      (recent || []).map(function (r) {
        var when = new Date(r.started_at);
        var place = [r.city, r.region].filter(Boolean).join(", ");
        return el("tr", {}, [
          appCell(r.app),
          el("td", { text: flag(r.country) + (place || countryName(r.country)) }),
          el("td", { text: r.device || "" }),
          el("td", { text: r.referrer || "direct" }),
          el("td", { class: "num", text: fmtDuration(r.duration_s) }),
          el("td", { class: "num sub", text: when.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) })
        ]);
      })
    );
  }

  /* ---------- init ---------- */
  document.getElementById("key-input").addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter") return;
    setKey(ev.target.value.trim());
    ev.target.value = "";
    load(currentDays);
  });

  /* Magic-link support: /analytics/#key=... saves the key and scrubs it from the URL. */
  var hashKey = location.hash.match(/^#key=(.+)$/);
  if (hashKey) {
    setKey(decodeURIComponent(hashKey[1]).trim());
    history.replaceState(null, "", location.pathname + location.search);
  }

  if (getKey()) load(currentDays);
  else showGate("");
})();
</script>
</body>
</html>
