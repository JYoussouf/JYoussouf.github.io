name = "site-analytics"
main = "src/index.js"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "site_analytics"
database_id = "159ea1ea-231d-4859-a5fa-ed8a17c9e3e2"

[vars]
ALLOWED_ORIGINS = "https://joseppy.ca,https://www.joseppy.ca,https://jyoussouf.github.io,https://mytimmiespassport.com,https://timmies-passport.pages.dev"
# Account id is not a secret; the read-only analytics token is, and lives in
# the CF_ANALYTICS_TOKEN secret.
CF_ACCOUNT_ID = "9ad7a6b011f4a53c4ffb8b42bc85dba4"

[[d1_databases]]
binding = "TIMMIES_DB"
database_name = "timmies-passport-db"
database_id = "fc079bea-6a90-47df-b833-f88955693786"

# The usage watch, every five minutes. Hourly missed a crossing outright:
# 84% at one reading, 117% by the next. At prime-time burn (~1M rows/hour) 90%
# to the cap is under fifteen minutes, so five is the coarsest interval that
# still gets a message out in time. Cost is one GraphQL call and two tiny D1
# reads a tick - nothing against the reads it exists to protect.
[triggers]
crons = ["*/5 * * * *"]
