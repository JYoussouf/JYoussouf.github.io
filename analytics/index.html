<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pulse · joseppy.ca</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128200;</text></svg>">
<style>
  /* Palette and hard-line treatment are the wroom dashboard's, so the two
     pages read as one product rather than two tools that happen to share a
     domain. Square corners, 1px steel borders, a faint top sheen, no
     shadows. See analytics/wroom/index.html for the original. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0a0c0e;
    --surface-1: #14171a;
    --surface-2: #1b1f23;
    --sheen: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0) 42%);
    --text-primary: #f2f5f7;
    --text-secondary: #aeb6bd;
    --muted: #8a939b;
    --grid: #23282d;
    --baseline: #3a4148;
    --border: #2a3036;
    --border-strong: #3a4148;
    --accent: #3aa0ff;
    --accent-soft: rgba(58, 160, 255, 0.12);
    --ok: #2fd076;
    --warn: #ffb224;
    --bad: #ff5d5d;
    --series-1: #3aa0ff;
    --series-2: #ff7a2f;
    --series-3: #2fd076;
    --series-4: #ffc53d;
    --series-5: #ff5d8f;
    --series-6: #29c8c8;
    --series-7: #a48fff;
    --series-8: #ff5d5d;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #eef0f2;
    --surface-1: #ffffff;
    --surface-2: #f3f5f7;
    --sheen: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0) 42%);
    --text-primary: #14181c;
    --text-secondary: #454c53;
    --muted: #5f676e;
    --grid: #dde1e5;
    --baseline: #b8bfc6;
    --border: #ccd2d8;
    --border-strong: #aab2ba;
    --accent: #0b6fd6;
    --accent-soft: rgba(11, 111, 214, 0.10);
    --ok: #0f9d55;
    --warn: #8a5a00;
    --bad: #d63a3a;
    --series-1: #0b6fd6;
    --series-2: #d95d16;
    --series-3: #0f9d55;
    --series-4: #c79400;
    --series-5: #d6407a;
    --series-6: #0a9e9e;
    --series-7: #6a53d6;
    --series-8: #d63a3a;
  }
  * { box-sizing: border-box; margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 0 28px 56px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .head {
    position: sticky; top: 0; z-index: 5;
    background: var(--page);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 16px 0 12px;
    border-bottom: 2px solid var(--border-strong);
    margin-bottom: 18px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 19px; font-weight: 750; letter-spacing: -0.01em; }
  .brand .sub { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .controls { display: flex; align-items: center; gap: 8px; }

  .ranges { display: flex; background: var(--surface-1); border: 1px solid var(--border); }
  .ranges button {
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); background: none;
    border: none; border-right: 1px solid var(--border); padding: 6px 12px; cursor: pointer;
  }
  .ranges button:last-child { border-right: none; }
  .ranges button:hover { color: var(--text-primary); }
  .ranges button[aria-pressed="true"] { color: var(--page); background: var(--accent); }
  .icon-btn {
    font: inherit; font-size: 14px; line-height: 1; cursor: pointer;
    background: var(--surface-1); color: var(--text-secondary);
    border: 1px solid var(--border); padding: 7px 10px;
  }
  .icon-btn:hover { color: var(--text-primary); border-color: var(--border-strong); }

  /* ---- the shell: a project rail, and whatever that project is saying ----
     Every project used to be a filter pill on one page, which made the page
     feel like one report you kept narrowing. They are separate things with
     separate questions, so each gets its own address and its own place in a
     list you can read top to bottom. "All apps" stays, first, because the
     pooled number is a real view and not the absence of a choice. */
  .shell { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 26px; align-items: start; }
  @media (max-width: 900px) { .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

  .rail { position: sticky; top: 74px; display: flex; flex-direction: column; gap: 2px; }
  @media (max-width: 900px) { .rail { position: static; flex-direction: row; flex-wrap: wrap; } }
  .rail .rail-group {
    font-size: 10px; font-weight: 750; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.11em;
    padding: 14px 10px 6px;
  }
  @media (max-width: 900px) { .rail .rail-group { width: 100%; padding: 8px 0 2px; } }
  .rail a, .rail button {
    display: flex; align-items: center; gap: 9px; width: 100%;
    font: inherit; font-size: 13px; font-weight: 600; text-align: left; text-decoration: none;
    color: var(--text-secondary); background: none; cursor: pointer;
    border: 1px solid transparent; border-left: 2px solid transparent;
    padding: 7px 10px;
  }
  .rail a:hover, .rail button:hover { color: var(--text-primary); background: var(--surface-1); }
  .rail button[aria-current="true"] {
    color: var(--text-primary); background: var(--surface-1);
    border-color: var(--border); border-left-color: var(--accent);
  }
  .rail .dot { width: 8px; height: 8px; flex: none; }
  .rail .tally { margin-left: auto; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rail .out { color: var(--muted); font-weight: 500; }
  .rail .out:hover { color: var(--accent); }

  .viewhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .viewhead h2 { font-size: 17px; font-weight: 750; letter-spacing: -0.01em; }
  .viewhead .sub { color: var(--muted); font-size: 12px; }

  .highlights { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface-1); border: 1px solid var(--border);
    padding: 5px 12px; font-size: 12.5px; color: var(--text-secondary);
  }
  .chip strong { color: var(--text-primary); font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip.hot { border-color: var(--accent); background: var(--accent-soft); color: var(--text-primary); }
  .chip.hot::before { content: ""; width: 7px; height: 7px; background: var(--accent); flex: none; }
  .chip .up { color: var(--ok); }
  .chip .down { color: var(--bad); }

  /* KPI band: one slab, hairline-divided. */
  .tiles {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    background: var(--surface-1); background-image: var(--sheen);
    border: 1px solid var(--border); margin-bottom: 16px;
  }
  .tile { padding: 13px 16px 12px; border-right: 1px solid var(--grid); }
  .tile:last-child { border-right: none; }
  .tile .label { color: var(--muted); font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.09em; }
  .tile .value { font-size: 28px; font-weight: 700; margin-top: 3px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .tile .delta { font-size: 12px; margin-top: 1px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tile .delta .up { color: var(--ok); font-weight: 600; }
  .tile .delta .down { color: var(--bad); font-weight: 600; }

  .card {
    background: var(--surface-1); background-image: var(--sheen);
    border: 1px solid var(--border); margin-bottom: 16px; overflow: hidden;
  }
  .card__head {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    font: inherit; background: none; border: none; border-bottom: 1px solid var(--grid);
    color: inherit; cursor: pointer;
    padding: 11px 16px; text-align: left;
  }
  .card__head h2 {
    font-size: 11px; font-weight: 750; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .card__head .chev { color: var(--muted); font-size: 10px; transition: transform 0.15s; }
  .card.collapsed .card__head { border-bottom: none; }
  .card.collapsed .card__head .chev { transform: rotate(-90deg); }
  .card__body { padding: 14px 16px 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 12px; }
  .legend i { width: 10px; height: 10px; display: inline-block; }
  .chart-wrap { overflow-x: auto; }
  svg text { font: 10.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cols .card { margin-bottom: 16px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } body { padding: 0 14px 40px; } }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; color: var(--muted); font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 5px 8px; border-bottom: 1px solid var(--border-strong);
  }
  td { padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; display: inline-block; margin-right: 8px; vertical-align: 1px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
  .sub { color: var(--muted); font-size: 12px; }
  .show-more {
    display: block; width: 100%; margin-top: 8px; padding: 6px;
    font: inherit; font-size: 12px; color: var(--muted); background: none;
    border: none; border-top: 1px dashed var(--grid); cursor: pointer;
  }
  .show-more:hover { color: var(--text-primary); }

  /* A sortable header is a button filling the cell, so the whole header is the
     hit target rather than just the few characters of the label. */
  th.sortable { padding: 0; }
  th.sortable button {
    display: flex; align-items: center; gap: 4px;
    width: 100%; padding: 4px 8px;
    font: inherit; color: inherit; background: none; border: none; cursor: pointer;
  }
  th.sortable.num button { justify-content: flex-end; }
  th.sortable button:hover { color: var(--text-primary); }
  /* The arrow is always in the layout so sorting a column cannot nudge the
     header's width; only its opacity changes. Dim on hover previews the
     direction a click would give you, solid marks the column actually sorted. */
  th.sortable .arrow { font-size: 8px; opacity: 0; }
  th.sortable button:hover .arrow { opacity: 0.45; }
  th.sortable[aria-sort] { color: var(--text-primary); }
  th.sortable[aria-sort] .arrow { opacity: 1; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-2); border: 1px solid var(--border-strong);
    padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.45); white-space: nowrap;
  }
  .tooltip .t-day { font-weight: 700; margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }

  #gate { max-width: 320px; margin: 18vh auto 0; text-align: center; }
  #gate h1 { font-size: 22px; margin-bottom: 4px; }
  #gate input {
    font: inherit; width: 100%; margin-top: 14px; padding: 9px 11px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); color: var(--text-primary);
  }
  #gate .err { color: #e34948; font-size: 12px; margin-top: 8px; min-height: 18px; }
  .empty { color: var(--muted); text-align: center; padding: 22px 0; font-size: 13px; }
  .apptabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
  .apptabs button {
    font: inherit; font-size: 13px; color: var(--text-secondary); background: none;
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .apptabs button:hover { color: var(--text-primary); }
  .apptabs button[aria-pressed="true"] { color: var(--text-primary); background: var(--surface-2); font-weight: 600; }
  .apptabs .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .funnel-row { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .funnel-label { width: 160px; font-size: 13px; color: var(--text-secondary); }
  .funnel-track { flex: 1; height: 22px; background: var(--grid); border-radius: 7px; overflow: hidden; }
  .funnel-fill { height: 100%; border-radius: 7px; min-width: 3px; }
  .funnel-num { width: 120px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }


  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="gate" hidden>
  <h1>Pulse</h1>
  <p class="sub">joseppy.ca analytics · enter the key</p>
  <input id="key-input" type="password" autocomplete="off" placeholder="Dashboard key">
  <div class="err" id="gate-err"></div>
</div>

<div id="dash" hidden>
  <div class="head">
    <div class="brand"><h1>Pulse</h1><span class="sub">joseppy.ca</span></div>
    <div class="controls">
      <div class="ranges" id="ranges" role="group" aria-label="Date range"></div>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">&#9788;</button>
    </div>
  </div>

  <div class="shell">
  <nav class="rail" id="rail" aria-label="Projects"></nav>
  <main>

  <div id="product-view">
  <div class="viewhead"><h2 id="view-title">All apps</h2><span class="sub" id="view-sub"></span></div>
  <div class="highlights" id="highlights"></div>
  <div class="tiles" id="tiles"></div>

  <div class="card" data-card="funnel" id="funnel-card" hidden>
    <button class="card__head"><h2>Timmies funnel</h2><span class="chev">&#9660;</span></button>
    <div class="card__body"><div id="funnel"></div></div>
  </div>

  <div class="card" data-card="timmies-users" id="timmies-users-card" hidden>
    <button class="card__head"><h2>Passport holders</h2><span class="chev">&#9660;</span></button>
    <div class="card__body"><div id="timmies-users-table"></div></div>
  </div>

  <div class="card" data-card="chart">
    <button class="card__head"><h2>Plays over time</h2><span class="chev">&#9660;</span></button>
    <div class="card__body">
      <div class="legend" id="legend"></div>
      <div class="chart-wrap"><div id="chart"></div></div>
    </div>
  </div>

  <div class="cols">
    <div class="card" data-card="apps">
      <button class="card__head"><h2>By game</h2><span class="chev">&#9660;</span></button>
      <div class="card__body"><div id="apps-table"></div></div>
    </div>
    <div class="card" data-card="countries">
      <button class="card__head"><h2>By country</h2><span class="chev">&#9660;</span></button>
      <div class="card__body"><div id="countries-table"></div></div>
    </div>
    <div class="card" data-card="events">
      <button class="card__head"><h2>Clicks</h2><span class="chev">&#9660;</span></button>
      <div class="card__body"><div id="events-table"></div></div>
    </div>
    <div class="card" data-card="recent-events">
      <button class="card__head"><h2>Recent clicks</h2><span class="chev">&#9660;</span></button>
      <div class="card__body"><div id="recent-events-table"></div></div>
    </div>
    <div class="card" data-card="leaderboard">
      <button class="card__head"><h2>Puppy Detective leaderboard</h2><span class="chev">&#9660;</span></button>
      <div class="card__body"><div id="leaderboard-table"></div></div>
    </div>
  </div>

  <div class="card" data-card="recent">
    <button class="card__head"><h2>Recent sessions</h2><span class="chev">&#9660;</span></button>
    <div class="card__body"><div id="recent-table"></div></div>
  </div>
  </div>

  <div id="cloudflare-view" hidden>
    <div class="viewhead"><h2>Cloudflare</h2><span class="sub">Free-tier usage against every limit, account-wide</span></div>
    <div class="highlights" id="cf-highlights"></div>
    <div id="cf-mount"></div>
  </div>

  </main>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script src="cf-panels.js"></script>
<script>
(function () {
  "use strict";
  var API = "https://site-analytics.joseppy-workers.workers.dev";
  var KEY_STORAGE = "sa_dash_key";
  var THEME_STORAGE = "sa_theme";
  var COLLAPSE_STORAGE = "sa_collapsed";
  var TABLE_LIMIT = 8;
  var RANGES = [{ d: 7, label: "7d" }, { d: 30, label: "30d" }, { d: 90, label: "90d" }, { d: 365, label: "1y" }, { d: 3650, label: "All" }];
  var APP_LABELS = {
    portfolio: "Portfolio",
    northern_eh: "Northern Eh",
    the_great_puppy_detective: "Puppy Detective",
    spotify_venn: "Spotify Venn",
    q1_wrapped: "Q1 Wrapped",
    timmies_passport: "Timmies Passport"
  };
  var APP_SLOTS = { portfolio: 1, northern_eh: 2, the_great_puppy_detective: 3, spotify_venn: 4 };
  var EVENT_LABELS = {
    cv_open: "CV opened",
    github_click: "GitHub visit",
    tierlistbot_click: "TierListBot visit",
    score_submit: "Score submitted",
    session_high_score: "Session high score",
    outbound_click: "Outbound click",
    form_start: "Form started",
    file_download: "File download",
    stamp: "Store stamped",
    account_created: "Account created",
    share_instagram: "Share: Instagram",
    share_facebook: "Share: Facebook",
    share_snapchat: "Share: Snapchat",
    share_x: "Share: X",
    share_save: "Share: image saved"
  };
  var nextSlot = 5;
  var currentDays = 30;
  var leaderboardLoaded = false;
  var APP_STORAGE = "sa_app";
  var currentApp = "";
  var VIEW_STORAGE = "sa_view";
  var currentView = "product";
  try { currentApp = localStorage.getItem(APP_STORAGE) || ""; } catch (e) {}
  try { currentView = localStorage.getItem(VIEW_STORAGE) || "product"; } catch (e) {}
  if (currentView !== "cloudflare") currentView = "product";
  var lastData = null;
  /* How the passport holders table is sorted, or null for the order the worker
     sent it in - by stamp count, which is the leaderboard view of the same
     people. Lives out here so switching range does not reset the sort. */
  var timmiesSort = null;

  function slotFor(app) {
    if (!APP_SLOTS[app]) { APP_SLOTS[app] = nextSlot < 9 ? nextSlot++ : 8; }
    return APP_SLOTS[app];
  }
  function colorFor(app) { return "var(--series-" + slotFor(app) + ")"; }
  function labelFor(app) { return APP_LABELS[app] || app; }
  function eventLabel(name) { return EVENT_LABELS[name] || name; }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }
  function svgEl(tag, attrs) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs || {}) node.setAttribute(k, attrs[k]);
    return node;
  }
  function fmtDuration(s) {
    s = Math.round(s || 0);
    if (s < 60) return s + "s";
    if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
    return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
  }
  var regionNames;
  try { regionNames = new Intl.DisplayNames(["en"], { type: "region" }); } catch (e) {}
  function countryName(code) {
    if (!code || code === "??") return "Unknown";
    try { return regionNames ? regionNames.of(code) : code; } catch (e) { return code; }
  }
  function flag(code) {
    if (!code || !/^[A-Z]{2}$/.test(code)) return "";
    return String.fromCodePoint(0x1f1e6 + code.charCodeAt(0) - 65, 0x1f1e6 + code.charCodeAt(1) - 65) + " ";
  }

  /* ---------- theme ---------- */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("theme-toggle").innerHTML = theme === "dark" ? "&#9788;" : "&#9789;";
  }
  try { applyTheme(localStorage.getItem(THEME_STORAGE) || "dark"); } catch (e) { applyTheme("dark"); }
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_STORAGE, next); } catch (e) {}
    applyTheme(next);
  });

  /* ---------- collapsible cards ---------- */
  function collapsedSet() {
    try { return new Set(JSON.parse(localStorage.getItem(COLLAPSE_STORAGE) || "[]")); } catch (e) { return new Set(); }
  }
  function saveCollapsed(set) {
    try { localStorage.setItem(COLLAPSE_STORAGE, JSON.stringify(Array.from(set))); } catch (e) {}
  }
  (function initCollapse() {
    var collapsed = collapsedSet();
    document.querySelectorAll(".card[data-card]").forEach(function (card) {
      var id = card.getAttribute("data-card");
      if (collapsed.has(id)) card.classList.add("collapsed");
      card.querySelector(".card__head").addEventListener("click", function () {
        card.classList.toggle("collapsed");
        var set = collapsedSet();
        if (card.classList.contains("collapsed")) set.add(id); else set.delete(id);
        saveCollapsed(set);
      });
    });
  })();

  /* ---------- auth + fetch ---------- */
  function getKey() { try { return localStorage.getItem(KEY_STORAGE) || ""; } catch (e) { return ""; } }
  function setKey(v) { try { localStorage.setItem(KEY_STORAGE, v); } catch (e) {} }

  function showGate(message) {
    document.getElementById("dash").hidden = true;
    var gate = document.getElementById("gate");
    gate.hidden = false;
    document.getElementById("gate-err").textContent = message || "";
    document.getElementById("key-input").focus();
  }

  function load(days) {
    currentDays = days;
    fetch(API + "/api/stats?days=" + days, { headers: { "x-dash-key": getKey() } })
      .then(function (res) {
        if (res.status === 401) { showGate(getKey() ? "Wrong key." : ""); throw new Error("unauthorized"); }
        if (!res.ok) throw new Error("request failed: " + res.status);
        return res.json();
      })
      .then(render)
      .catch(function (err) { if (err.message !== "unauthorized") console.error(err); });
  }

  function render(data) {
    lastData = data;
    document.getElementById("gate").hidden = true;
    document.getElementById("dash").hidden = false;
    paint();
    goto(currentRoute(), true);
  }

  /*
   * One dataset, many lenses. The worker returns everything broken out per
   * app; the selected tab decides whether a section sees the whole pool or
   * one app's slice, and the tiles are recomputed from the slice so they
   * never quote a global number against a filtered table.
   */
  function view(data) {
    if (!currentApp) {
      var byCountry = {};
      (data.countries || []).forEach(function (r) {
        var k = r.country;
        byCountry[k] = byCountry[k] || { country: k, plays: 0, total_s: 0 };
        byCountry[k].plays += r.plays;
        byCountry[k].total_s += r.total_s || 0;
      });
      var byName = {};
      (data.events || []).forEach(function (r) {
        byName[r.name] = byName[r.name] || { name: r.name, count: 0, sessions: 0 };
        byName[r.name].count += r.count;
        byName[r.name].sessions += r.sessions || 0;
      });
      return {
        days: data.days,
        totals: data.totals,
        insights: data.insights,
        apps: data.apps || [],
        daily: data.daily || [],
        recent: data.recent || [],
        recentEvents: data.recentEvents || [],
        countries: Object.values(byCountry).sort(function (a, b) { return b.plays - a.plays; }),
        events: Object.values(byName).sort(function (a, b) { return b.count - a.count; })
      };
    }
    var only = function (r) { return r.app === currentApp; };
    var apps = (data.apps || []).filter(only);
    var countries = (data.countries || []).filter(only)
      .sort(function (a, b) { return b.plays - a.plays; });
    var plays = 0, total_s = 0;
    apps.forEach(function (a) { plays += a.plays; total_s += a.total_s || 0; });
    return {
      days: data.days,
      totals: { plays: plays, total_s: total_s, countries: countries.length },
      insights: null,
      apps: apps,
      daily: (data.daily || []).filter(only),
      recent: (data.recent || []).filter(only),
      recentEvents: (data.recentEvents || []).filter(only),
      countries: countries,
      events: (data.events || []).filter(only)
        .sort(function (a, b) { return b.count - a.count; })
    };
  }

  function paint() {
    if (!lastData) return;
    var v = view(lastData);
    renderRanges();
    renderRail();
    renderViewHead(v);
    if (currentApp) {
      document.getElementById("highlights").textContent = "";
    } else {
      renderHighlights(v);
    }
    renderTiles(v);
    renderChart(v);
    renderApps(v.apps);
    renderCountries(v.countries);
    renderEvents(v.events);
    renderRecentEvents(v.recentEvents);
    renderRecent(v.recent);
    renderFunnel(lastData);
    renderTimmiesUsers(lastData);
    var lb = document.querySelector('[data-card="leaderboard"]');
    if (lb) lb.hidden = !(currentApp === "" || currentApp === "the_great_puppy_detective");
    if (!leaderboardLoaded) { leaderboardLoaded = true; loadLeaderboard(); }
  }

  /* =====================================================================
   * The project rail.
   *
   * Each project is its own destination with its own address (#/timmies),
   * not a filter pill, because they are separate products people ask
   * separate questions about. "All apps" is first and is a real view - the
   * pooled number, not the absence of a filter. Cloudflare sits at the
   * bottom under its own heading, because it is about the account rather
   * than about any one project.
   * ===================================================================== */
  var RAIL_ORDER = ["portfolio", "northern_eh", "the_great_puppy_detective", "timmies_passport", "spotify_venn", "q1_wrapped"];
  var cfPanels = null;

  function routeFromHash() {
    var m = String(location.hash || "").match(/^#\/([a-z0-9_]+)$/i);
    return m ? m[1] : null;
  }

  function currentRoute() {
    if (currentView === "cloudflare") return "cloudflare";
    return currentApp || "all";
  }

  function goto(route, push) {
    if (route === "cloudflare") { currentView = "cloudflare"; }
    else {
      currentView = "product";
      currentApp = route === "all" ? "" : route;
      try { localStorage.setItem(APP_STORAGE, currentApp); } catch (e) {}
    }
    try { localStorage.setItem(VIEW_STORAGE, currentView); } catch (e) {}
    if (push !== false) {
      var want = "#/" + route;
      if (location.hash !== want) history.replaceState(null, "", location.pathname + location.search + want);
    }
    applyView();
    if (currentView === "product") paint();
  }

  function railApps(data) {
    var seen = {};
    (data && data.apps ? data.apps : []).forEach(function (a) { seen[a.app] = true; });
    var names = RAIL_ORDER.filter(function (a) { return seen[a] || APP_LABELS[a]; });
    // Anything reporting that we have no label for still deserves a row.
    Object.keys(seen).forEach(function (a) { if (names.indexOf(a) === -1) names.push(a); });
    return names;
  }

  function renderRail() {
    var rail = document.getElementById("rail");
    rail.textContent = "";
    var route = currentRoute();

    function item(id, label, colour, tally) {
      var b = el("button", { "aria-current": String(route === id) });
      if (colour) {
        var d = el("i", { class: "dot" });
        d.style.background = colour;
        b.appendChild(d);
      }
      b.appendChild(document.createTextNode(label));
      if (tally != null) b.appendChild(el("span", { class: "tally", text: String(tally) }));
      b.addEventListener("click", function () { goto(id); });
      rail.appendChild(b);
      return b;
    }

    item("all", "All apps");

    rail.appendChild(el("div", { class: "rail-group", text: "Projects" }));
    railApps(lastData).forEach(function (app) {
      var row = (lastData && lastData.apps ? lastData.apps : []).filter(function (a) { return a.app === app; });
      var plays = row.reduce(function (n, a) { return n + (a.plays || 0); }, 0);
      item(app, labelFor(app), colorFor(app), plays || null);
    });

    rail.appendChild(el("div", { class: "rail-group", text: "Account" }));
    item("cloudflare", "Cloudflare");

    rail.appendChild(el("div", { class: "rail-group", text: "Elsewhere" }));
    var link = el("a", { class: "out", href: "wroom/", text: "wroom| →" });
    rail.appendChild(link);
  }

  function applyView() {
    var cf = currentView === "cloudflare";
    document.getElementById("product-view").hidden = cf;
    document.getElementById("cloudflare-view").hidden = !cf;
    document.getElementById("ranges").hidden = cf;
    renderRail();
    if (cf) {
      if (!cfPanels) {
        cfPanels = CloudflarePanels.create(document.getElementById("cf-mount"), {
          days: 30,
          onMeta: renderCloudflareHighlights
        });
      }
      cfPanels.start();
    } else if (cfPanels) {
      cfPanels.stop();
    }
  }

  function renderCloudflareHighlights(data) {
    var wrap = document.getElementById("cf-highlights");
    wrap.textContent = "";
    var cats = data.categories || [];
    var worst = cats.slice().sort(function (a, b) { return b.pct - a.pct; })[0];
    if (worst) {
      wrap.appendChild(chip(worst.pct >= 75, [
        "Closest to a limit: ", el("strong", { text: worst.label }),
        " at ", el("strong", { text: worst.pct.toFixed(worst.pct >= 10 ? 0 : 1) + "%" })
      ]));
    }
    var over = cats.filter(function (c) { return c.pct >= 100; });
    wrap.appendChild(chip(over.length > 0, over.length
      ? [el("strong", { text: String(over.length) }), " " + (over.length === 1 ? "category has" : "categories have") + " gone over"]
      : ["No category over its limit"]));
    var errs = (data.workerErrors || []).reduce(function (a, b) { return a + b.value; }, 0);
    if (errs) wrap.appendChild(chip(true, [el("strong", { text: String(errs) }), " Worker errors in " + data.days + " days"]));
    var when = new Date(data.generatedAt);
    wrap.appendChild(chip(false, ["Updated ", el("strong", {
      text: when.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })
    }), data.cached ? " (cached)" : ""]));
  }

  window.addEventListener("hashchange", function () {
    var r = routeFromHash();
    if (r && r !== currentRoute()) goto(r, false);
  });

  function setApp(app) { goto(app || "all"); }

  /* The rail sits in the periphery, so the column says out loud which
     project these numbers belong to and over what window. */
  function renderViewHead(v) {
    document.getElementById("view-title").textContent = currentApp ? labelFor(currentApp) : "All apps";
    var range = RANGES.filter(function (r) { return r.d === currentDays; })[0];
    var parts = [];
    if (range) parts.push(range.d >= 3650 ? "all time" : "last " + range.label);
    if (v && v.totals) parts.push((v.totals.plays || 0).toLocaleString() + " plays");
    document.getElementById("view-sub").textContent = parts.join(" · ");
  }

  /*
   * Visitors, then the two commitments a visitor can make, as bars scaled
   * to the visitor count - the picture of who plays without signing up.
   */
  function renderFunnel(data) {
    var card = document.getElementById("funnel-card");
    if (currentApp !== "timmies_passport") { card.hidden = true; return; }
    card.hidden = false;
    var wrap = document.getElementById("funnel");
    wrap.textContent = "";
    var appRow = (data.apps || []).find(function (a) { return a.app === "timmies_passport"; });
    var visitors = appRow ? appRow.plays : 0;
    var ev = {};
    (data.events || []).forEach(function (e) { if (e.app === "timmies_passport") ev[e.name] = e; });
    var steps = [
      { label: "Visitors", v: visitors, color: "var(--series-1)" },
      { label: "Stamped a store", v: (ev.stamp || {}).sessions || 0, color: "var(--series-3)" },
      /* The passport database is the truth for signups; the beacon event
         only backs it up when the stats endpoint lacks the binding. */
      { label: "Created an account", v: (data.timmies ? data.timmies.accounts : (ev.account_created || {}).count) || 0, color: "var(--series-4)" }
    ];
    steps.forEach(function (s, i) {
      var pctOfVisitors = visitors ? Math.round((s.v / visitors) * 100) : 0;
      var fill = el("div", { class: "funnel-fill" });
      fill.style.background = s.color;
      fill.style.width = (visitors ? Math.max((s.v / visitors) * 100, s.v ? 1 : 0) : 0) + "%";
      var num = i === 0 ? String(s.v) : s.v + " · " + pctOfVisitors + "%";
      wrap.appendChild(el("div", { class: "funnel-row" }, [
        el("div", { class: "funnel-label", text: s.label }),
        el("div", { class: "funnel-track" }, [fill]),
        el("div", { class: "funnel-num", text: num })
      ]));
    });
    if (!visitors) wrap.appendChild(el("div", { class: "empty", text: "No sessions in this range yet." }));
  }

  /*
   * Every passport holder by name, with where their stamps are. The worker
   * strips this to display_name, join date, and stamped places - emails and
   * password hashes never reach the dashboard.
   */
  function renderTimmiesUsers(data) {
    var card = document.getElementById("timmies-users-card");
    var users = data.timmies && data.timmies.users;
    if (currentApp !== "timmies_passport" || !users) { card.hidden = true; return; }
    card.hidden = false;
    sortableTable(
      document.getElementById("timmies-users-table"),
      [
        { label: "Display name", key: "name", value: function (u) { return (u.name || "").toLowerCase(); } },
        { label: "Stamps", num: 1, key: "stamps", desc: 1, value: function (u) { return u.stamps || 0; } },
        { label: "Stamped in", key: "places", value: function (u) { return (u.places || "").toLowerCase(); } },
        /* created_at is written as an ISO-8601 UTC string, which is fixed
           width, so comparing the raw values as strings already sorts them
           chronologically - no parsing, and no Invalid Date to handle. */
        { label: "Joined", num: 1, key: "joined", desc: 1, value: function (u) { return u.joined || ""; } }
      ],
      users,
      function (u) {
        return el("tr", {}, [
          el("td", { text: u.name }),
          el("td", { class: "num", text: String(u.stamps) }),
          el("td", { text: u.places || "-" }),
          el("td", { class: "num", text: (u.joined || "").slice(0, 10) })
        ]);
      },
      timmiesSort,
      function (next) { timmiesSort = next; renderTimmiesUsers(data); }
    );
  }

  function renderRanges() {
    var wrap = document.getElementById("ranges");
    wrap.textContent = "";
    RANGES.forEach(function (r) {
      var b = el("button", { text: r.label, "aria-pressed": String(r.d === currentDays) });
      b.addEventListener("click", function () { load(r.d); });
      wrap.appendChild(b);
    });
  }

  /* ---------- highlights ---------- */
  function chip(hot, parts) {
    var c = el("span", { class: "chip" + (hot ? " hot" : "") });
    parts.forEach(function (p) {
      if (typeof p === "string") c.appendChild(document.createTextNode(p));
      else c.appendChild(p);
    });
    return c;
  }
  function deltaNode(current, previous) {
    if (!previous) return el("strong", { text: "new" });
    var pct = Math.round(((current - previous) / previous) * 100);
    if (pct === 0) return el("span", { class: "sub", text: "flat" });
    var node = el("span", { class: pct > 0 ? "up" : "down" });
    node.textContent = (pct > 0 ? "↑ " : "↓ ") + Math.abs(pct) + "%";
    return node;
  }

  function renderHighlights(data) {
    var wrap = document.getElementById("highlights");
    wrap.textContent = "";
    var ins = data.insights || {};
    var week = ins.week || { plays: 0, total_s: 0 };
    var prev = ins.prevWeek || { plays: 0, total_s: 0 };
    var weekEvents = {};
    (ins.weekEvents || []).forEach(function (e) { weekEvents[e.name] = e.count; });

    if (week.plays > 0) {
      var pct = prev.plays ? Math.abs(Math.round(((week.plays - prev.plays) / prev.plays) * 100)) : null;
      var hot = !prev.plays || pct >= 25;
      wrap.appendChild(chip(hot, [el("strong", { text: week.plays + (week.plays === 1 ? " play" : " plays") }), " this week ", deltaNode(week.plays, prev.plays)]));
    } else if (prev.plays > 0) {
      wrap.appendChild(chip(false, ["Quiet week: ", el("strong", { text: "0 plays" }), " (was " + prev.plays + ")"]));
    }

    (ins.newCountries || []).slice(0, 5).forEach(function (c) {
      wrap.appendChild(chip(true, ["New country: ", el("strong", { text: flag(c.country) + countryName(c.country) })]));
    });

    if (weekEvents.cv_open) {
      wrap.appendChild(chip(true, ["CV opened ", el("strong", { text: weekEvents.cv_open + "×" }), " this week"]));
    }
    if (weekEvents.score_submit) {
      wrap.appendChild(chip(true, [el("strong", { text: weekEvents.score_submit + (weekEvents.score_submit === 1 ? " score" : " scores") }), " submitted this week"]));
    }

    if (ins.longest && ins.longest.duration_s >= 60) {
      var where = ins.longest.city ? " from " + ins.longest.city : "";
      wrap.appendChild(chip(false, ["Longest session: ", el("strong", { text: fmtDuration(ins.longest.duration_s) }), " on " + labelFor(ins.longest.app) + where]));
    }
    if (ins.busiest && ins.busiest.plays > 1) {
      wrap.appendChild(chip(false, ["Busiest day: ", el("strong", { text: ins.busiest.day }), " (" + ins.busiest.plays + " plays)"]));
    }
    if (!wrap.childNodes.length) {
      wrap.appendChild(chip(false, ["All quiet. Share a game link and watch this light up."]));
    }
  }

  /* ---------- tiles ---------- */
  function renderTiles(data) {
    var t = data.totals || {};
    var ins = data.insights || {};
    var avg = t.plays ? (t.total_s || 0) / t.plays : 0;
    var wrap = document.getElementById("tiles");
    wrap.textContent = "";
    var tiles = [
      { label: "Plays", value: String(t.plays || 0) },
      { label: "Time played", value: fmtDuration(t.total_s) },
      { label: "Avg session", value: fmtDuration(avg) },
      { label: "Countries", value: String(t.countries || 0) }
    ];
    tiles.forEach(function (tile, i) {
      var node = el("div", { class: "tile" }, [
        el("div", { class: "label", text: tile.label }),
        el("div", { class: "value", text: tile.value })
      ]);
      if (i === 0 && ins.week) {
        var delta = el("div", { class: "delta" }, [deltaNode(ins.week.plays || 0, (ins.prevWeek || {}).plays || 0)]);
        delta.appendChild(document.createTextNode(" vs last week"));
        node.appendChild(delta);
      }
      wrap.appendChild(node);
    });
  }

  /* ---------- chart ---------- */
  function dayList(days) {
    var out = [];
    var d = new Date();
    d.setUTCHours(0, 0, 0, 0);
    for (var i = days - 1; i >= 0; i--) {
      var dt = new Date(d.getTime() - i * 86400000);
      out.push(dt.toISOString().slice(0, 10));
    }
    return out;
  }

  function renderChart(data) {
    var wrap = document.getElementById("chart");
    var legend = document.getElementById("legend");
    wrap.textContent = "";
    legend.textContent = "";

    var apps = (data.apps || []).map(function (a) { return a.app; });
    apps.sort(function (a, b) { return slotFor(a) - slotFor(b); });
    var byDay = {};
    (data.daily || []).forEach(function (row) {
      byDay[row.day] = byDay[row.day] || {};
      byDay[row.day][row.app] = row.plays;
    });
    var days = dayList(data.days);
    var firstData = null;
    (data.daily || []).forEach(function (row) {
      if (!firstData || row.day < firstData) firstData = row.day;
    });
    if (firstData) {
      var firstIdx = days.indexOf(firstData);
      if (firstIdx > 0) days = days.slice(Math.min(firstIdx, days.length - 7));
    }
    var bucketSize = days.length > 400 ? 30 : days.length > 120 ? 7 : 1;
    var buckets = [];
    for (var bi = 0; bi < days.length; bi += bucketSize) {
      buckets.push(days.slice(bi, bi + bucketSize));
    }
    function bucketCount(bucket, app) {
      var total = 0;
      bucket.forEach(function (day) { total += (byDay[day] || {})[app] || 0; });
      return total;
    }
    function bucketLabel(bucket) {
      if (bucket.length === 1) return bucket[0];
      return bucket[0] + " to " + bucket[bucket.length - 1];
    }
    var maxTotal = 0;
    buckets.forEach(function (bucket) {
      var total = 0;
      apps.forEach(function (app) { total += bucketCount(bucket, app); });
      if (total > maxTotal) maxTotal = total;
    });

    if (!maxTotal) {
      wrap.appendChild(el("div", { class: "empty", text: "No plays in this range yet." }));
      return;
    }

    apps.forEach(function (app) {
      var chipEl = el("span", {}, [el("i", {})]);
      chipEl.firstChild.style.background = colorFor(app);
      chipEl.appendChild(document.createTextNode(labelFor(app)));
      legend.appendChild(chipEl);
    });

    var W = Math.max(640, wrap.clientWidth || 640);
    var H = 220, padL = 30, padB = 20, padT = 8;
    var plotW = W - padL - 8, plotH = H - padT - padB;
    var step = plotW / buckets.length;
    var barW = Math.max(2, Math.min(28, step - 2));
    var yMax = Math.max(4, Math.ceil(maxTotal * 1.1));
    var svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Stacked bar chart of plays over time" });

    [0, 0.5, 1].forEach(function (f) {
      var y = padT + plotH - plotH * f;
      svg.appendChild(svgEl("line", { x1: padL, x2: W - 8, y1: y, y2: y, stroke: f === 0 ? "var(--baseline)" : "var(--grid)", "stroke-width": 1 }));
      var label = svgEl("text", { x: padL - 6, y: y + 4, "text-anchor": "end" });
      label.textContent = String(Math.round(yMax * f));
      svg.appendChild(label);
    });

    var tooltip = document.getElementById("tooltip");
    buckets.forEach(function (bucket, i) {
      var x = padL + i * step + (step - barW) / 2;
      var yCursor = padT + plotH;
      var stack = [];
      apps.forEach(function (app) {
        var v = bucketCount(bucket, app);
        if (!v) return;
        stack.push({ app: app, v: v });
        var h = (v / yMax) * plotH;
        yCursor -= h;
        var rect = svgEl("rect", {
          x: x, y: yCursor, width: barW, height: Math.max(h - 1, 1),
          fill: colorFor(app), stroke: "var(--surface-1)", "stroke-width": 1
        });
        svg.appendChild(rect);
      });
      if (stack.length) {
        var cap = svgEl("rect", { x: x, y: yCursor, width: barW, height: 3, rx: 1.5, fill: colorFor(stack[stack.length - 1].app) });
        svg.appendChild(cap);
      }
      var hit = svgEl("rect", { x: padL + i * step, y: padT, width: step, height: plotH, fill: "transparent" });
      hit.addEventListener("mousemove", function (ev) {
        tooltip.style.display = "block";
        tooltip.textContent = "";
        tooltip.appendChild(el("div", { class: "t-day", text: bucketLabel(bucket) }));
        if (!stack.length) tooltip.appendChild(el("div", { class: "t-row", text: "No plays" }));
        stack.slice().reverse().forEach(function (s) {
          var row = el("div", { class: "t-row" }, [el("i", { class: "dot" })]);
          row.firstChild.style.background = colorFor(s.app);
          row.appendChild(document.createTextNode(labelFor(s.app) + ": " + s.v));
          tooltip.appendChild(row);
        });
        tooltip.style.left = Math.min(ev.clientX + 12, window.innerWidth - tooltip.offsetWidth - 8) + "px";
        tooltip.style.top = (ev.clientY + 12) + "px";
      });
      hit.addEventListener("mouseleave", function () { tooltip.style.display = "none"; });
      svg.appendChild(hit);

      var every = Math.ceil(buckets.length / 10);
      if (i % every === 0) {
        var t = svgEl("text", { x: padL + i * step + step / 2, y: H - 4, "text-anchor": "middle" });
        t.textContent = bucketSize >= 30 ? bucket[0].slice(0, 7) : bucket[0].slice(5);
        svg.appendChild(t);
      }
    });

    wrap.appendChild(svg);
  }

  /* ---------- tables ---------- */
  /*
   * A header with an onSort becomes a button; one without stays plain text, so
   * every table that does not opt in renders exactly as it did.
   */
  function table(headers, rows) {
    var thead = el("thead", {}, [el("tr", {}, headers.map(function (h) {
      if (!h.onSort) return el("th", { text: h.label, class: h.num ? "num" : "" });
      var th = el("th", { class: (h.num ? "num " : "") + "sortable" });
      if (h.dir) th.setAttribute("aria-sort", h.dir < 0 ? "descending" : "ascending");
      // Unsorted, the arrow points the way a first click would sort it.
      var down = h.dir ? h.dir < 0 : !!h.desc;
      var btn = el("button", { type: "button" }, [
        el("span", { text: h.label }),
        el("span", { class: "arrow", text: down ? "▼" : "▲" })
      ]);
      btn.addEventListener("click", h.onSort);
      th.appendChild(btn);
      return th;
    }))]);
    var tbody = el("tbody", {}, rows);
    return el("table", {}, [thead, tbody]);
  }

  function limitedTable(wrap, headers, rows, showAllInitially) {
    wrap.textContent = "";
    if (!rows.length) { wrap.appendChild(el("div", { class: "empty", text: "Nothing yet." })); return; }
    function draw(showAll) {
      wrap.textContent = "";
      wrap.appendChild(table(headers, showAll ? rows : rows.slice(0, TABLE_LIMIT)));
      if (rows.length > TABLE_LIMIT) {
        var btn = el("button", { class: "show-more", text: showAll ? "Show less" : "Show all " + rows.length });
        btn.addEventListener("click", function () { draw(!showAll); });
        wrap.appendChild(btn);
      }
    }
    draw(!!showAllInitially);
  }

  /*
   * limitedTable with clickable headers. Rows arrive as data plus a renderer
   * rather than as finished <tr>s, because a sort has to compare the value
   * behind a cell and not the text printed in it: "10" loses to "9" as a
   * string, and the Joined column shows a date but holds a timestamp.
   *
   * Sort state is owned by the caller and handed back through onChange, since
   * these tables are rebuilt from scratch whenever the range changes and a
   * sort the user picked should outlive the redraw.
   */
  function sortableTable(wrap, headers, items, renderRow, state, onChange) {
    var col = null;
    headers.forEach(function (h) { if (state && h.key === state.key) col = h; });
    var ordered = items.slice();
    if (col) {
      ordered.sort(function (a, b) {
        var x = col.value(a), y = col.value(b);
        if (x == null) x = "";
        if (y == null) y = "";
        return (x < y ? -1 : x > y ? 1 : 0) * state.dir;
      });
    }
    // Showing everything is a decision about the table, not about one ordering
    // of it - so re-sorting an expanded table leaves it expanded.
    var expanded = !!wrap.querySelector(".show-more") &&
      wrap.querySelectorAll("tbody tr").length > TABLE_LIMIT;
    limitedTable(
      wrap,
      headers.map(function (h) {
        if (!h.key) return h;
        return {
          label: h.label,
          num: h.num,
          desc: h.desc,
          dir: state && state.key === h.key ? state.dir : 0,
          onSort: function () {
            // Clicking the sorted column flips it; clicking a new one starts in
            // the direction that answers the question you clicked it to ask -
            // newest first for dates, biggest first for counts, A-Z for names.
            onChange({
              key: h.key,
              dir: state && state.key === h.key ? -state.dir : (h.desc ? -1 : 1)
            });
          }
        };
      }),
      ordered.map(renderRow),
      expanded
    );
  }

  function appCell(app) {
    var cell = el("td", {}, [el("i", { class: "dot" })]);
    cell.firstChild.style.background = colorFor(app);
    cell.appendChild(document.createTextNode(labelFor(app)));
    return cell;
  }

  function renderApps(apps) {
    limitedTable(
      document.getElementById("apps-table"),
      [{ label: "Game" }, { label: "Plays", num: 1 }, { label: "Time", num: 1 }, { label: "Avg", num: 1 }],
      (apps || []).map(function (a) {
        return el("tr", {}, [
          appCell(a.app),
          el("td", { class: "num", text: String(a.plays) }),
          el("td", { class: "num", text: fmtDuration(a.total_s) }),
          el("td", { class: "num", text: fmtDuration(a.avg_s) })
        ]);
      })
    );
  }

  function renderCountries(countries) {
    limitedTable(
      document.getElementById("countries-table"),
      [{ label: "Country" }, { label: "Plays", num: 1 }, { label: "Time", num: 1 }],
      (countries || []).map(function (c) {
        return el("tr", {}, [
          el("td", { text: flag(c.country) + countryName(c.country) }),
          el("td", { class: "num", text: String(c.plays) }),
          el("td", { class: "num", text: fmtDuration(c.total_s) })
        ]);
      })
    );
  }

  function renderEvents(events) {
    limitedTable(
      document.getElementById("events-table"),
      [{ label: "Event" }, { label: "Count", num: 1 }],
      events.map(function (e) {
        return el("tr", {}, [
          el("td", { text: eventLabel(e.name) }),
          el("td", { class: "num", text: String(e.count) })
        ]);
      })
    );
  }

  function renderRecentEvents(recentEvents) {
    limitedTable(
      document.getElementById("recent-events-table"),
      [{ label: "Event" }, { label: "Where" }, { label: "When", num: 1 }],
      recentEvents.map(function (e) {
        var when = new Date(e.created_at);
        var place = [e.city, e.region].filter(Boolean).join(", ") || countryName(e.country);
        return el("tr", {}, [
          el("td", { text: eventLabel(e.name) + (e.meta ? " (" + e.meta + ")" : "") }),
          el("td", { text: flag(e.country) + place }),
          el("td", { class: "num sub", text: when.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) })
        ]);
      })
    );
  }

  function loadLeaderboard() {
    var wrap = document.getElementById("leaderboard-table");
    fetch("https://gpd-leaderboard.joseppy-workers.workers.dev/api/leaderboard?limit=10")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var entries = data.entries || [];
        wrap.textContent = "";
        if (!entries.length) { wrap.appendChild(el("div", { class: "empty", text: "No scores yet." })); return; }
        var rows = entries.map(function (entry, i) {
          return el("tr", {}, [
            el("td", { class: "num sub", text: String(i + 1) }),
            el("td", { text: entry[0] }),
            el("td", { class: "num", text: String(entry[1]) })
          ]);
        });
        wrap.appendChild(table([{ label: "#", num: 1 }, { label: "Player" }, { label: "Score", num: 1 }], rows));
      })
      .catch(function () {
        wrap.textContent = "";
        wrap.appendChild(el("div", { class: "empty", text: "Leaderboard unavailable." }));
      });
  }

  function renderRecent(recent) {
    limitedTable(
      document.getElementById("recent-table"),
      [{ label: "Game" }, { label: "Where" }, { label: "Device" }, { label: "Referrer" }, { label: "Duration", num: 1 }, { label: "When", num: 1 }],
      (recent || []).map(function (r) {
        var when = new Date(r.started_at);
        var place = [r.city, r.region].filter(Boolean).join(", ");
        return el("tr", {}, [
          appCell(r.app),
          el("td", { text: flag(r.country) + (place || countryName(r.country)) }),
          el("td", { text: r.device || "" }),
          el("td", { text: r.referrer || "direct" }),
          el("td", { class: "num", text: fmtDuration(r.duration_s) }),
          el("td", { class: "num sub", text: when.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) })
        ]);
      })
    );
  }

  /* ---------- init ---------- */
  document.getElementById("key-input").addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter") return;
    setKey(ev.target.value.trim());
    ev.target.value = "";
    load(currentDays);
  });

  /* Magic-link support: /analytics/#key=... saves the key and scrubs it from the URL. */
  var hashKey = location.hash.match(/^#key=(.+)$/);
  if (hashKey) {
    setKey(decodeURIComponent(hashKey[1]).trim());
    history.replaceState(null, "", location.pathname + location.search);
  }

  (function initRoute() {
    var r = routeFromHash();
    if (!r) return;
    if (r === "cloudflare") currentView = "cloudflare";
    else { currentView = "product"; currentApp = r === "all" ? "" : r; }
  })();
  renderRail();
  if (getKey()) { load(currentDays); }
  else showGate("");
})();
</script>
</body>
</html>
